[project]
name = "vpm"
version = "0.1.0"
description = "Visual product matcher for footwear: photo -> catalogue SKU"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "timm>=1.0.17",
    "numpy>=1.26",
    "pillow>=10",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "tqdm>=4.66",
    "faiss-cpu>=1.9",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
]

[project.scripts]
vpm = "vpm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The studio serves two .html files that live beside the modules. Without this
# they are absent from a real install -- an editable install masks the bug,
# because it points at the source tree where the files sit next to the code.
[tool.setuptools.package-data]
"vpm.studio" = ["*.html"]
